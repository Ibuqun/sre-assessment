mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  hostMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true
config:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}
        http: {endpoint: 0.0.0.0:4318}
    zipkin:
      endpoint: 0.0.0.0:9411
    hostmetrics:
      collection_interval: 30s
      scrapers:
        cpu: {}
        memory: {}
        disk: {}
        filesystem: {}
        network: {}
        load: {}
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 20
    k8sattributes:
      extract:
        metadata: [k8s.pod.name, k8s.namespace.name, k8s.deployment.name, k8s.node.name]
    resourcedetection:
      detectors: [env, k8snode]
    batch:
      send_batch_size: 1000
      timeout: 10s
  exporters:
    otlp/gateway:
      endpoint: "otel-gateway-collector.observability.svc.cluster.local:4317"
      tls:
        insecure: true   # internal cluster hop only; TLS terminates at the gateway->APM leg
  service:
    pipelines:
      traces:
        receivers: [otlp, zipkin]
        processors: [memory_limiter, k8sattributes, resourcedetection, batch]
        exporters: [otlp/gateway]
      metrics:
        receivers: [otlp, hostmetrics]
        processors: [memory_limiter, k8sattributes, resourcedetection, batch]
        exporters: [otlp/gateway]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resourcedetection, batch]
        exporters: [otlp/gateway]
    telemetry:
      metrics:
        address: 0.0.0.0:8888   # collector's own health metrics — "monitoring the monitoring"