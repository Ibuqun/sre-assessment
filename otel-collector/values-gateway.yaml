mode: deployment
replicaCount: 2
image:
  repository: otel/opentelemetry-collector-contrib
config:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}
        http: {endpoint: 0.0.0.0:4318}
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 20
    batch:
      send_batch_size: 2000
      timeout: 10s
    tail_sampling:
      decision_wait: 10s
      policies:
        - name: always-sample-errors
          type: status_code
          status_code: {status_codes: [ERROR]}
        - name: sample-10pct-successful
          type: probabilistic
          probabilistic: {sampling_percentage: 10}
  exporters:
    otlphttp/elastic:
      endpoint: "https://<apm-server-host>:8200"
      headers:
        Authorization: "Bearer ${env:ELASTIC_APM_SECRET_TOKEN}"
      tls:
        insecure: false
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, tail_sampling, batch]
        exporters: [otlphttp/elastic]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/elastic]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/elastic]
    telemetry:
      metrics:
        address: 0.0.0.0:8888