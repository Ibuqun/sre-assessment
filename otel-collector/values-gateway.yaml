mode: deployment
replicaCount: 2
image:
  repository: otel/opentelemetry-collector-contrib

# Elastic APM API key is provided from a Kubernetes Secret.
extraEnvs:
  - name: ELASTIC_APM_API_KEY
    valueFrom:
      secretKeyRef:
        name: elastic-apm-credentials
        key: api-key

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 20
    batch:
      send_batch_size: 2000
      timeout: 10s
    tail_sampling:
      decision_wait: 10s
      num_traces: 50000
      expected_new_traces_per_sec: 10
      policies:
        - name: always-sample-errors
          type: status_code
          status_code: {status_codes: [ERROR]}
        - name: always-sample-slow-requests
          type: latency
          latency: {threshold_ms: 2000}
        - name: sample-10pct-successful
          type: probabilistic
          probabilistic: {sampling_percentage: 10}
        - name: always-sample-checkout-path
          type: string_attribute
          string_attribute:
            key: service.name
            values: ["checkoutservice", "paymentservice"]
  exporters:
    otlphttp/elastic:
      # Elastic Cloud APM endpoint uses standard HTTPS on port 443.
      endpoint: "https://258eb842f48b4c939a05ae34359dfbfb.apm.us-east1.gcp.elastic-cloud.com:443"
      headers:
        Authorization: "ApiKey ${env:ELASTIC_APM_API_KEY}"
      tls:
        insecure: false
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, tail_sampling, batch]
        exporters: [otlphttp/elastic]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/elastic]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/elastic]
    telemetry:
      metrics:
        # Collector self-monitoring metrics exposed on :8888.
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
