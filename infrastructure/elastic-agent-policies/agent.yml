outputs:
  default:
    type: elasticsearch
    hosts: ["${ELASTICSEARCH_HOSTS}"]
    api_key: "${ELASTIC_AGENT_API_KEY}"

agent:
  monitoring:
    enabled: true
    use_output: default
    logs: true
    metrics: true

inputs:
  - id: kubernetes-container-logs
    type: filestream
    use_output: default
    streams:
      - id: kubernetes-container-logs-stream
        paths:
          - /var/log/containers/*.log
        parsers:
          - container: ~
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
